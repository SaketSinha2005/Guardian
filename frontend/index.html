<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Guardian — Audit Log</title>

    <!-- External Scripts & Stylesheets -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="tailwind.config.js"></script>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css"/>
</head>
<body class="font-body-md text-body-md min-h-screen flex flex-col h-screen overflow-hidden">

    <!-- ── TopAppBar ──────────────────────────────────────────────────────── -->
    <header class="fixed top-0 w-full z-50 bg-background border-b border-outline-variant flex justify-between items-center h-14 px-gutter shrink-0">
        <div class="flex items-center gap-4">
            <span class="font-headline-md text-headline-md font-bold text-on-surface">Guardian Agent</span>
        </div>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 px-3 py-1 bg-surface-container-highest rounded-full border border-outline-variant">
                <span class="w-2 h-2 rounded-full bg-secondary pulse-dot"></span>
                <span class="font-code-sm text-code-sm text-on-surface uppercase tracking-wider">Live</span>
            </div>
            <div class="flex items-center gap-2">
                <button aria-label="Notifications" class="p-2 text-on-surface-variant hover:bg-surface-container-highest transition-colors active:scale-95 duration-150 rounded-full">
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">notifications</span>
                </button>
                <button aria-label="Settings" class="p-2 text-on-surface-variant hover:bg-surface-container-highest transition-colors active:scale-95 duration-150 rounded-full">
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
                </button>
            </div>
        </div>
    </header>

    <!-- ── Layout ─────────────────────────────────────────────────────────── -->
    <div class="flex flex-1 mt-14 overflow-hidden w-full">

        <!-- Sidebar -->
        <aside class="w-[240px] bg-background border-r border-outline-variant flex flex-col py-4 shrink-0 overflow-y-auto no-scrollbar">
            <nav class="flex flex-col gap-1 px-2">
                <button class="nav-item active flex items-center gap-3 px-3 py-2 rounded-lg text-on-surface hover:bg-surface-container-highest transition-colors text-left"
                        onclick="switchView('audit-view', this)">
                    <span class="material-symbols-outlined text-[20px]">history</span>
                    <span class="font-body-md">Audit Log</span>
                </button>
                <button class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg text-on-surface hover:bg-surface-container-highest transition-colors text-left border-l-3 border-transparent"
                        onclick="switchView('pods-view', this)">
                    <span class="material-symbols-outlined text-[20px]">deployed_code</span>
                    <span class="font-body-md">Pods</span>
                </button>
            </nav>
        </aside>

        <!-- Main content -->
        <main class="flex-1 overflow-y-auto no-scrollbar w-full bg-[#161618] relative" id="main-content">

            <!-- Audit Log View -->
            <div class="w-full max-w-[1200px] mx-auto p-gutter pt-section-gap flex flex-col gap-[1px]" id="audit-view">
                <div class="flex flex-col gap-[1px]" id="log-container">
                    <!-- Injected by script.js -->
                </div>
            </div>

            <!-- Pods View -->
            <div class="hidden w-full max-w-[1200px] mx-auto p-gutter pt-section-gap flex-col gap-[1px]" id="pods-view">
                <div class="flex flex-col gap-[1px]" id="pods-container">
                    <!-- Injected by script.js -->
                </div>
            </div>

            <!-- Pod Detail Slide-in Panel -->
            <div class="absolute top-0 right-0 bottom-0 w-[500px] bg-surface-container-low border-l border-outline-variant shadow-2xl flex flex-col z-40"
                 id="pod-detail-panel">

                <!-- Panel header -->
                <div class="flex justify-between items-center px-4 py-3 border-b border-outline-variant shrink-0">
                    <div class="flex items-center gap-2">
                        <span class="material-symbols-outlined text-[18px] text-on-surface-variant">deployed_code</span>
                        <h2 class="font-headline-md text-on-surface" id="panel-pod-name">Pod Details</h2>
                    </div>
                    <button class="p-1 text-on-surface-variant hover:bg-surface-container-highest rounded-full transition-colors"
                            onclick="closePodPanel()">
                        <span class="material-symbols-outlined text-[20px]">close</span>
                    </button>
                </div>

                <!-- Panel body — filled by script.js -->
                <div class="flex-1 overflow-y-auto p-4 no-scrollbar" id="panel-body"></div>
            </div>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
